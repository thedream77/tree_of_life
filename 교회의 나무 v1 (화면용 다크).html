<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>교회의 나무 — 기독교 분파의 계통 연표</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet">
<style>
  :root { --bg: oklch(0.23 0.012 70); }
  html, body { margin: 0; height: 100%; background: #161512; overflow: hidden; }
  #stage { position: fixed; inset: 0; cursor: grab; }
  #stage:active { cursor: grabbing; }
  #poster { position: absolute; left: 0; top: 0; transform-origin: 0 0; background: var(--bg); font-family: 'IBM Plex Sans KR', sans-serif; }
  svg { display: block; }
  svg text { font-family: 'IBM Plex Sans KR', sans-serif; }
  .halo { paint-order: stroke; stroke: var(--bg); stroke-width: 4px; stroke-linejoin: round; }
  #ui { position: fixed; right: 16px; bottom: 16px; z-index: 10; display: flex; gap: 6px; }
  #ui button { font: 500 13px 'IBM Plex Sans KR', sans-serif; background: #f3f1ec; color: #1f1d1a; border: 0; border-radius: 6px; padding: 9px 13px; cursor: pointer; min-width: 38px; }
  #ui button:hover { background: #fff; }
  #hint { position: fixed; left: 16px; bottom: 18px; font: 12px 'IBM Plex Sans KR', sans-serif; color: #a39d92; }
  #loading { position: fixed; inset: 0; display: grid; place-items: center; color: #a39d92; font: 14px 'IBM Plex Sans KR', sans-serif; }
</style>
</head>
<body>
<div id="loading">교회의 나무를 그리는 중…</div>
<div id="stage"><div id="poster" data-screen-label="Church Tree Poster"><svg id="tree"></svg></div></div>
<div id="hint">스크롤로 확대 · 드래그로 이동</div>
<div id="ui"><button id="zin">+</button><button id="zout">−</button><button id="fit">전체 보기</button><button id="dl">PNG로 저장</button></div>

<script src="https://unpkg.com/d3@7.9.0/dist/d3.min.js"></script>
<script src="https://unpkg.com/html-to-image@1.11.11/dist/html-to-image.js"></script>
<script src="church/data.js"></script>
<script>
document.fonts.load('700 20px "IBM Plex Sans KR"').then(() => document.fonts.ready).then(() => {
  const s = document.createElement('script'); s.src = 'church/render.js'; s.onload = init; document.body.appendChild(s);
});
function init() {
  const { W, H } = window.__POSTER;
  const poster = document.getElementById('poster');
  poster.style.width = W + 'px'; poster.style.height = H + 'px';
  document.getElementById('loading').remove();
  const stage = d3.select('#stage');
  const zoom = d3.zoom().scaleExtent([0.03, 4]).on('zoom', e => {
    const t = e.transform; poster.style.transform = `translate(${t.x}px,${t.y}px) scale(${t.k})`;
    try { localStorage.setItem('church-tree-zoom', JSON.stringify([t.x, t.y, t.k])); } catch (_) {}
  });
  stage.call(zoom);
  const fitT = () => { const s = Math.min(innerWidth / W, innerHeight / H) * 0.98;
    return d3.zoomIdentity.translate((innerWidth - W * s) / 2, (innerHeight - H * s) / 2).scale(s); };
  let saved = null; try { saved = JSON.parse(localStorage.getItem('church-tree-zoom')); } catch (_) {}
  stage.call(zoom.transform, saved ? d3.zoomIdentity.translate(saved[0], saved[1]).scale(saved[2]) : fitT());
  document.getElementById('fit').onclick = () => stage.transition().duration(400).call(zoom.transform, fitT());
  document.getElementById('zin').onclick = () => stage.transition().duration(250).call(zoom.scaleBy, 1.5);
  document.getElementById('zout').onclick = () => stage.transition().duration(250).call(zoom.scaleBy, 1 / 1.5);
  document.getElementById('dl').onclick = async e => {
    const btn = e.currentTarget; btn.textContent = '저장 중…';
    const t = poster.style.transform; poster.style.transform = 'none';
    try {
      const pr = Math.min(1.5, 16000 / Math.max(W, H), Math.sqrt(2.4e8 / (W * H)));
      const url = await htmlToImage.toPng(poster, { width: W, height: H, pixelRatio: pr });
      const a = document.createElement('a'); a.href = url; a.download = '교회의 나무.png'; a.click();
    } finally { poster.style.transform = t; btn.textContent = 'PNG로 저장'; }
  };
}
</script>
</body>
</html>
